name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
        run: |
          test -n "$SIGNING_STORE_BASE64"
          printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="$(cat version-code.txt)"
          ./gradlew :app:assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/CalorieTracker-$VERSION_NAME.apk"
          python scripts/release_manifest.py "release/CalorieTracker-$VERSION_NAME.apk" "$VERSION_NAME" "$VERSION_CODE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "release/CalorieTracker-$VERSION_NAME.apk"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "CalorieTracker ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE_NOTES.md --verify-tag
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
